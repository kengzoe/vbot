name: Deriv Signal Checker

on:
  schedule:
    # Runs every 15 minutes (at :00, :15, :30, :45 past the hour)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to run it manually from GitHub to test

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python serverless_bot.py
